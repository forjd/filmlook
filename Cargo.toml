[package]
name = "filmlook"
version = "0.1.0"
edition = "2024"
authors = ["Forjd"]
description = "Deterministic film-emulation looks for images."
license = "MIT"
repository = "https://github.com/forjd/filmlook"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.10"
kamadak-exif = "0.6.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
opt-level = 1
