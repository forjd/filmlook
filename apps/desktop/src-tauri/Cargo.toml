[package]
name = "filmlook-desktop"
version = "0.1.0"
edition = "2024"
authors = ["Forjd"]
description = "Desktop frontend for filmlook."
license = "MIT"

[lib]
name = "filmlook_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
filmlook = { path = "../../.." }
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
